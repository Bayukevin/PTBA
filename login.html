<!-- Login screen: markup only; logic remains in Index.html -->
<div id="loginScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-logo"><i class="fa-solid fa-boxes-stacked"></i></span>
      <div>
        <strong>Inventory Hub</strong
        ><small>SWI PTBA · Management System</small>
      </div>
    </div>
    <div class="auth-heading">
      <span class="auth-eyebrow">SELAMAT DATANG</span>
      <h1>Masuk ke akun Anda</h1>
      <p>Kelola inventori dan pantau data dalam satu tempat.</p>
    </div>
    <form id="loginForm" onsubmit="submitLogin(event)">
      <label class="form-label">Email</label>
      <div class="auth-input">
        <i class="fa-regular fa-envelope"></i
        ><input
          id="loginEmail"
          type="email"
          class="form-control"
          placeholder="nama@perusahaan.com"
          autocomplete="username"
          required
        />
      </div>
      <label class="form-label mt-3">Password</label>
      <div class="auth-input">
        <i class="fa-solid fa-lock"></i
        ><input
          id="loginPassword"
          type="password"
          class="form-control"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        /><button
          type="button"
          class="password-toggle"
          onclick="togglePassword()"
        >
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
      <div
        id="loginError"
        class="alert alert-danger d-none mt-3 py-2 small"
      ></div>
      <button id="loginSubmit" class="btn btn-primary w-100 auth-submit mt-4">
        Masuk <i class="fa-solid fa-arrow-right ms-2"></i>
      </button>
    </form>
    <div class="auth-divider"><span>atau lanjutkan dengan</span></div>
    <!-- <div 
      id="googleButton"
      class="w-100"
    ></div> -->
    <p class="auth-footnote">
      <i class="fa-solid fa-shield-halved me-1"></i> Sesi login berlaku selama
      12 jam.
    </p>
    <p class="auth-setup-note">
      Admin awal: jalankan <code>setupInitialAdmin()</code> di Apps Script.
    </p>
  </div>
</div>
