<style>
  #tblAPLService th,
  #tblAPLService td {
    white-space: nowrap;
  }
</style>

<div class="row g-3 mb-3">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <div>
      <h5 class="fw-bold mb-0 text-dark">
        <i class="fa-solid fa-gears text-danger me-2"></i>Report APL Service
      </h5>
      <p class="text-muted extra-small mb-0">
        Analisis stok & jumlah item berdasarkan Indikator SOH APL Service.
      </p>
    </div>
    <button class="btn btn-success btn-sm" onclick="exportAPLToExcel()">
      <i class="fa-solid fa-file-excel me-1"></i> Export Excel
    </button>
  </div>
</div>

<!-- Filter Panel & Mode Grafik -->
<div class="card card-custom p-3 mb-3">
  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted"
        >Filter Indikator</label
      >
      <select
        id="aplFilterIndikator"
        class="form-select form-select-sm"
        onchange="applyAPLFilters()"
      >
        <option value="ALL">Semua Indikator (ALL)</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted"
        >Mode Tampilan Grafik</label
      >
      <div class="btn-group btn-group-sm w-100" role="group">
        <input
          type="radio"
          class="btn-check"
          name="aplChartUnit"
          id="aplUnitCount"
          value="COUNT"
          checked
          onchange="renderAPLChart()"
        />
        <label class="btn btn-outline-danger" for="aplUnitCount"
          >Jumlah Item</label
        >
        <input
          type="radio"
          class="btn-check"
          name="aplChartUnit"
          id="aplUnitQty"
          value="QTY"
          onchange="renderAPLChart()"
        />
        <label class="btn btn-outline-danger" for="aplUnitQty">Total Qty</label>
      </div>
    </div>
    <div class="col-md-4 text-end">
      <button
        class="btn btn-outline-secondary btn-sm"
        onclick="resetAPLFilters()"
      >
        <i class="fa-solid fa-rotate-left me-1"></i> Reset Filter
      </button>
    </div>
  </div>
</div>

<!-- Section Grafik -->
<div class="row g-3 mb-4">
  <div class="col-12">
    <div class="card card-custom p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold text-dark mb-0">
          <i class="fa-solid fa-chart-bar text-danger me-2"></i>Grafik
          Distribusi per Indikator
        </h6>
        <span class="badge bg-secondary extra-small"></span>
      </div>
      <div id="chartAPLIndikator" style="min-height: 280px"></div>
    </div>
  </div>
</div>

<!-- Section Tabel Detail -->
<div class="card card-custom p-3">
  <h6 class="fw-bold text-dark mb-3">
    <i class="fa-solid fa-list text-danger me-2"></i>Detail List Item &
    Indikator SOH
  </h6>
  <div class="table-responsive">
    <table
      id="tblAPLService"
      class="table table-hover table-striped w-100 align-middle extra-small"
    >
      <thead class="table-dark">
        <tr>
          <th>No</th>
          <th>Material</th>
          <th>Deskripsi</th>
          <th>Qty</th>
          <th>SOH</th>
          <th>SOH Min</th>
          <th>SOH Max</th>
          <th>Indikator</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  let dataTableAPL = null;
  let rawAPLData = [];
  let chartAPLInstance = null;

  function loadAPLServiceData() {
    showLoading('Memuat Data Report APL Service...');

    google.script.run
      .withSuccessHandler(function (data) {
        hideLoading();
        rawAPLData = data || [];

        populateAPLDropdowns();
        renderAPLTable();
        renderAPLChart();
      })
      .withFailureHandler(function (err) {
        hideLoading();
        alert('Gagal memuat data APL Service: ' + err.message);
      })
      .getAPLServiceData();
  }

  function populateAPLDropdowns() {
    let indicators = new Set();
    rawAPLData.forEach((item) => {
      if (item.indikator) indicators.add(item.indikator);
    });

    let $select = $('#aplFilterIndikator');
    $select.html('<option value="ALL">Semua Indikator (ALL)</option>');

    Array.from(indicators)
      .sort()
      .forEach((ind) => {
        $select.append(`<option value="${ind}">${ind}</option>`);
      });
  }

  function renderAPLTable() {
    if ($.fn.DataTable.isDataTable('#tblAPLService')) {
      $('#tblAPLService').DataTable().destroy();
    }

    let $tbody = $('#tblAPLService tbody').empty();

    rawAPLData.forEach((r) => {
      let badgeClass = 'bg-secondary';
      let indUpper = r.indikator.toUpperCase();

      if (
        indUpper.includes('FAST') ||
        indUpper.includes('A') ||
        indUpper.includes('SAFE')
      )
        badgeClass = 'bg-success';
      else if (indUpper.includes('MEDIUM') || indUpper.includes('B'))
        badgeClass = 'bg-primary';
      else if (indUpper.includes('SLOW') || indUpper.includes('C'))
        badgeClass = 'bg-warning text-dark';
      else if (
        indUpper.includes('NON') ||
        indUpper.includes('D') ||
        indUpper.includes('REORDER')
      )
        badgeClass = 'bg-danger';

      let rowHtml = `
        <tr>
          <td>${r.no}</td>
          <td class="fw-bold">${r.material}</td>
          <td>${r.deskripsi}</td>
          <td>${r.qty}</td>
          <td class="fw-bold">${r.soh}</td>
          <td>${r.sohMin}</td>
          <td>${r.sohMax}</td>
          <td><span class="badge ${badgeClass}">${r.indikator}</span></td>
        </tr>
      `;
      $tbody.append(rowHtml);
    });

    dataTableAPL = $('#tblAPLService').DataTable({
      pageLength: 10,
      responsive: true,
      order: [[0, 'asc']],
    });

    applyAPLFilters();
  }

  function renderAPLChart() {
    if (!rawAPLData || rawAPLData.length === 0) return;

    let chartMode = $('input[name="aplChartUnit"]:checked').val() || 'COUNT';
    let indicatorAgg = {};

    rawAPLData.forEach((r) => {
      let key = r.indikator || 'Unassigned';
      if (!indicatorAgg[key]) {
        indicatorAgg[key] = { count: 0, qty: 0 };
      }
      indicatorAgg[key].count += 1;
      indicatorAgg[key].qty += r.qty;
    });

    let categories = Object.keys(indicatorAgg).sort();
    let values = categories.map((cat) =>
      chartMode === 'COUNT' ? indicatorAgg[cat].count : indicatorAgg[cat].qty
    );

    let options = {
      series: [
        {
          name: chartMode === 'COUNT' ? 'Jumlah Item' : 'Total Qty',
          data: values,
        },
      ],
      chart: {
        type: 'bar',
        height: 280,
        toolbar: { show: false },
        events: {
          dataPointSelection: function (event, chartContext, config) {
            let selectedIndex = config.dataPointIndex;
            if (selectedIndex !== undefined && selectedIndex >= 0) {
              let clickedIndikator = categories[selectedIndex];

              // Set filter dropdown & filter tabel otomatis saat grafik diklik
              $('#aplFilterIndikator').val(clickedIndikator);
              applyAPLFilters();
            }
          },
        },
      },
      colors: [
        '#C8102E',
        '#0d6efd',
        '#198754',
        '#ffc107',
        '#dc3545',
        '#6c757d',
      ],
      plotOptions: {
        bar: { distributed: true, borderRadius: 4, horizontal: false },
      },
      xaxis: { categories: categories },
      dataLabels: { enabled: true },
    };

    if (chartAPLInstance) chartAPLInstance.destroy();
    chartAPLInstance = new ApexCharts(
      document.querySelector('#chartAPLIndikator'),
      options
    );
    chartAPLInstance.render();
  }

  function applyAPLFilters() {
    if (!dataTableAPL) return;

    let val = $('#aplFilterIndikator').val() || 'ALL';

    if (val !== 'ALL') {
      // Filter pada kolom Indikator (Index 7)
      dataTableAPL
        .column(7)
        .search('^' + $.fn.dataTable.util.escapeRegex(val) + '$', true, false);
    } else {
      dataTableAPL.column(7).search('');
    }

    dataTableAPL.draw();
  }

  function resetAPLFilters() {
    $('#aplFilterIndikator').val('ALL');
    applyAPLFilters();
  }

  function exportAPLToExcel() {
    if (!dataTableAPL) return;

    showLoading('Mengeksport Data APL Service ke Excel...');
    setTimeout(() => {
      let headers = [];
      $('#tblAPLService thead th').each(function () {
        headers.push($(this).text().trim());
      });

      let filteredRows = dataTableAPL
        .rows({ filter: 'applied' })
        .data()
        .toArray();

      let exportData = [headers];
      filteredRows.forEach((row) => {
        let cleanRow = row.map((cell) => {
          let tempDiv = document.createElement('div');
          tempDiv.innerHTML = cell;
          return tempDiv.textContent || tempDiv.innerText || cell;
        });
        exportData.push(cleanRow);
      });

      let wb = XLSX.utils.book_new();
      let ws = XLSX.utils.aoa_to_sheet(exportData);
      XLSX.utils.book_append_sheet(wb, ws, 'APL_Service_Report');

      let currentFilter = $('#aplFilterIndikator').val();
      XLSX.writeFile(wb, `Report_APL_Service_${currentFilter}.xlsx`);
      hideLoading();
    }, 300);
  }
</script>
